[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mercado-financeiro"
version = "0.1.0"
description = "Point-in-time quantitative research core for B3/CVM"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.5,<2",
    "lxml>=5",
    "pandas>=2.1",
]

[project.optional-dependencies]
test = [
    "hypothesis>=6.140",
    "pytest>=8",
]
validation = [
    "arch>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
