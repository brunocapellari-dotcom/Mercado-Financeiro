[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mercado-financeiro"
version = "0.1.0"
description = "Point-in-time quantitative research core for B3/CVM"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.5,<2",
    "lxml>=5",
    "pandas>=2.1",
]

[project.optional-dependencies]
test = [
    "hypothesis>=6.140",
    "pytest>=8",
]
validation = [
    "arch>=8,<9",
]
quality = [
    "bandit>=1.9,<2",
    "mypy>=2.3,<3",
    "pip-audit>=2.10.1,<3",
    "pytest-cov>=7.1,<8",
    "pytest-randomly>=3.15,<4",
    "pytest-timeout>=2.4,<3",
    "ruff>=0.16.8,<0.17",
]
agents = [
    "pydantic-ai-harness[dynamic-workflow]>=0.32,<0.33",
    "pydantic-evals>=2.46,<2.47",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["artifacts", "data/raw", "data/interim", "data/processed"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
files = ["src/mercado_financeiro"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
show_error_codes = true
pretty = true
