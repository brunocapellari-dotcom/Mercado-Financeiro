name: b3-emissor-identity-audit

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/audit_b3_emissor_identity.py"
      - ".github/workflows/b3-emissor-identity-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install project
        run: pip install -e .
      - name: Audit official B3 EMISSOR identity file
        run: python scripts/audit_b3_emissor_identity.py
