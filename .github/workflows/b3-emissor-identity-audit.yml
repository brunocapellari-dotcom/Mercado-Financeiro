name: b3-emissor-identity-audit

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/audit_b3_emissor_identity.py"
      - ".github/workflows/b3-emissor-identity-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install project
        run: pip install -e .
      - name: Audit official B3 EMISSOR identity file
        run: python scripts/audit_b3_emissor_identity.py
