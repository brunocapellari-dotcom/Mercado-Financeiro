name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - name: Install patched build tooling, project and security tools
        run: |
          python -m pip install --upgrade 'pip>=26.2.1' 'setuptools>=83' wheel
          pip install -e '.[test]'
          pip install pip-audit bandit
      - name: Repository secret and data guard
        run: python scripts/security_scan.py
      - name: Dependency vulnerability audit
        run: pip-audit
      - name: Static security analysis
        run: bandit -r src -ll
      - name: Test security and PIT invariants
        run: pytest
