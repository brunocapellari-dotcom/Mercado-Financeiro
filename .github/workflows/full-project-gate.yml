name: full-project-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-project-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: deterministic-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install patched tooling and complete project
        run: |
          python -m pip install --upgrade 'pip>=26.2.1' 'setuptools>=83' wheel
          pip install -e '.[test]'
          pip install pip-audit bandit
      - name: Compile every Python source, script and test
        run: python -m compileall -q src scripts tests
      - name: Repository secret and data guard
        run: python scripts/security_scan.py
      - name: Run the complete test suite
        run: pytest
      - name: Static security analysis of all source code
        run: bandit -r src -ll
      - name: Dependency vulnerability audit
        run: pip-audit

  identity-source-integration:
    name: identity-source-integration
    if: always()
    needs: deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Install complete project
        run: |
          python -m pip install --upgrade 'pip>=26.2.1' 'setuptools>=83' wheel
          pip install -e '.[test]'
      - name: Audit historical identity 2011-2026 against official B3 and CVM sources
        run: python scripts/audit_identity_2011_2026.py

  source-diagnostic-regression:
    name: source-diagnostic-regression
    if: always()
    needs: deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Install complete project
        run: |
          python -m pip install --upgrade 'pip>=26.2.1' 'setuptools>=83' wheel
          pip install -e '.[test]'
      - name: Audit FCA schema history
        run: python scripts/audit_fca_schema.py
      - name: Audit FCA negotiation-code normalization
        run: python scripts/audit_fca_invalid_tickers.py
      - name: Audit official B3 COTAHIST 2011
        run: python scripts/audit_cotahist_live.py
      - name: Audit official B3 EMISSOR identity file
        run: python scripts/audit_b3_emissor_identity.py
      - name: Audit base 2011 identity reconstruction
        run: python scripts/audit_identity_2011_live.py
      - name: Audit 2011 identity with B3 EMISSOR evidence
        run: python scripts/audit_identity_2011_with_emissor.py
      - name: Audit 2011 identity through exact B3 ISIN registry
        run: python scripts/audit_identity_2011_exact_isin.py

  cvm-pit-source-integration:
    name: cvm-pit-source-integration
    if: always()
    needs: deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Install complete project
        run: |
          python -m pip install --upgrade 'pip>=26.2.1' 'setuptools>=83' wheel
          pip install -e '.[test]'
      - name: Audit early middle and recent CVM PIT capital vintages
        run: python scripts/audit_cvm_pit_history.py

  bvbg-source-integration:
    name: bvbg-source-integration
    if: always()
    needs: deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Install complete project
        run: |
          python -m pip install --upgrade 'pip>=26.2.1' 'setuptools>=83' wheel
          pip install -e '.[test]'
      - name: Audit historical B3 instrument snapshots
        run: python scripts/audit_bvbg028_history.py

  macro-source-integration:
    name: macro-source-integration
    if: always()
    needs: deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Install complete project
        run: |
          python -m pip install --upgrade 'pip>=26.2.1' 'setuptools>=83' wheel
          pip install -e '.[test]'
      - name: Audit public official macro sources
        run: python scripts/audit_official_macro_sources.py

  final-gate:
    name: final-project-gate
    if: always()
    needs:
      - deterministic
      - identity-source-integration
      - source-diagnostic-regression
      - cvm-pit-source-integration
      - bvbg-source-integration
      - macro-source-integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every whole-project gate
        env:
          DETERMINISTIC: ${{ needs.deterministic.result }}
          IDENTITY: ${{ needs.identity-source-integration.result }}
          SOURCE_DIAGNOSTICS: ${{ needs.source-diagnostic-regression.result }}
          CVM_PIT: ${{ needs.cvm-pit-source-integration.result }}
          BVBG: ${{ needs.bvbg-source-integration.result }}
          MACRO: ${{ needs.macro-source-integration.result }}
        run: |
          test "$DETERMINISTIC" = success
          test "$IDENTITY" = success
          test "$SOURCE_DIAGNOSTICS" = success
          test "$CVM_PIT" = success
          test "$BVBG" = success
          test "$MACRO" = success
          echo FULL_PROJECT_GATE_OK
