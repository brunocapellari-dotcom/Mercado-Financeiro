name: full-project-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-project-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: deterministic-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install patched tooling and complete project
        run: |
          python -m pip install --upgrade 'pip>=26.2.1' 'setuptools>=83' wheel
          pip install -e '.[test]'
          pip install pip-audit bandit
      - name: Compile every Python source, script and test
        run: python -m compileall -q src scripts tests
      - name: Repository secret and data guard
        run: python scripts/security_scan.py
      - name: Run the complete test suite
        run: pytest
      - name: Static security analysis of all source code
        run: bandit -r src -ll
      - name: Dependency vulnerability audit
        run: pip-audit

  official-source-integration:
    name: official-source-integration
    needs: deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install complete project
        run: |
          python -m pip install --upgrade 'pip>=26.2.1' 'setuptools>=83' wheel
          pip install -e '.[test]'
      - name: Audit exact historical identity against official B3 and CVM sources
        run: python scripts/audit_identity_2011_exact_isin.py
      - name: Audit historical B3 instrument snapshots
        run: python scripts/audit_bvbg028_history.py
      - name: Audit public official macro sources
        run: python scripts/audit_official_macro_sources.py

  final-gate:
    name: final-project-gate
    if: always()
    needs: [deterministic, official-source-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every whole-project gate
        env:
          DETERMINISTIC: ${{ needs.deterministic.result }}
          INTEGRATION: ${{ needs.official-source-integration.result }}
        run: |
          test "$DETERMINISTIC" = success
          test "$INTEGRATION" = success
          echo FULL_PROJECT_GATE_OK
