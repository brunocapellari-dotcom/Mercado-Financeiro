name: identity-2011-exact-isin-audit

on:
  pull_request:
    branches: [main]
    paths:
      - "src/mercado_financeiro/pit/b3_isin.py"
      - "src/mercado_financeiro/pit/__init__.py"
      - "scripts/audit_identity_2011_exact_isin.py"
      - ".github/workflows/identity-2011-exact-isin-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install project
        run: pip install -e .
      - name: Audit 2011 issuer identity through exact B3 ISIN registry
        run: python scripts/audit_identity_2011_exact_isin.py
