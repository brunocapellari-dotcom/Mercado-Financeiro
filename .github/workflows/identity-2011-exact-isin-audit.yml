name: identity-2011-exact-isin-audit

on:
  pull_request:
    branches: [main]
    paths:
      - "src/mercado_financeiro/pit/b3_isin.py"
      - "src/mercado_financeiro/pit/__init__.py"
      - "scripts/audit_identity_2011_exact_isin.py"
      - ".github/workflows/identity-2011-exact-isin-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install project
        run: pip install -e .
      - name: Audit 2011 issuer identity through exact B3 ISIN registry
        run: python scripts/audit_identity_2011_exact_isin.py
