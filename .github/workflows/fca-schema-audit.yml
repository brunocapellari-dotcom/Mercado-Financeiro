name: fca-schema-audit

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/audit_fca_schema.py"
      - ".github/workflows/fca-schema-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit FCA 2010-2026 schemas
        run: python scripts/audit_fca_schema.py
      - name: Upload FCA schema report
        uses: actions/upload-artifact@v4
        with:
          name: fca-schema-audit
          path: artifacts/fca_schema_audit.json
          if-no-files-found: error
          retention-days: 14
