name: fca-schema-audit

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/audit_fca_schema.py"
      - ".github/workflows/fca-schema-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Audit FCA 2010-2026 schemas
        run: python scripts/audit_fca_schema.py
