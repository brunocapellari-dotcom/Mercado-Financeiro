name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 4 * * 2'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    name: codeql-python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          languages: python
          queries: security-extended
      - name: Analyze without external SARIF upload
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          category: /language:python
          output: ${{ runner.temp }}/codeql-results
          upload: never
          upload-database: false
      - name: Enforce high and critical CodeQL findings
        run: python3 scripts/gate_codeql_sarif.py "${{ runner.temp }}/codeql-results" --threshold 7.0
