name: deploy-paper-shadow

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mercado-financeiro-paper-shadow-production
  cancel-in-progress: false

jobs:
  deploy-paper-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROJECT_ID: ai-holding-prod-bc
      REGION: southamerica-east1
      TF_STATE_BUCKET: ai-holding-prod-bc-tfstate
      TF_STATE_PREFIX: mercado-financeiro/prod
      WIF_PROVIDER: projects/868946857614/locations/global/workloadIdentityPools/github-actions/providers/ai-holding-main
      DEPLOY_SERVICE_ACCOUNT: github-deployer@ai-holding-prod-bc.iam.gserviceaccount.com
      MARKET_DATA_SECRET: mf-authorized-price-report-url
      JOB_NAME: mf-paper-shadow
      IMAGE_REPOSITORY: holding
      IMAGE_NAME: mercado-financeiro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Authenticate with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: '1.9.8'

      - name: Require authorized market-data secret version
        run: |
          gcloud secrets versions access latest             --secret="${MARKET_DATA_SECRET}"             --project="${PROJECT_ID}" >/dev/null

      - name: Build and push immutable runtime image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${IMAGE_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker build --pull --tag "${IMAGE}" .
          docker push "${IMAGE}"
          DIGEST="$(gcloud artifacts docker images describe             "${IMAGE}"             --project="${PROJECT_ID}"             --format='value(image_summary.digest)')"
          test -n "${DIGEST}"
          echo "IMAGE_REF=${REGION}-docker.pkg.dev/${PROJECT_ID}/${IMAGE_REPOSITORY}/${IMAGE_NAME}@${DIGEST}"             >> "${GITHUB_ENV}"

      - name: Initialize isolated production state
        run: |
          terraform -chdir=infra/terraform init             -backend-config="bucket=${TF_STATE_BUCKET}"             -backend-config="prefix=${TF_STATE_PREFIX}"

      - name: Plan PAPER/SHADOW deployment
        run: |
          terraform -chdir=infra/terraform plan             -var-file=prod.tfvars             -var="deploy_paper_shadow=true"             -var="runtime_image_ref=${IMAGE_REF}"             -out=tfplan

      - name: Reject destructive deployment plans
        run: |
          terraform -chdir=infra/terraform show -json tfplan             | jq -e 'all(.resource_changes[]?; (.change.actions | index("delete") | not))'

      - name: Apply PAPER/SHADOW deployment
        run: terraform -chdir=infra/terraform apply -auto-approve tfplan

      - name: Verify no public job invocation
        run: |
          policy="$(gcloud run jobs get-iam-policy "${JOB_NAME}"             --project="${PROJECT_ID}"             --region="${REGION}"             --format=json)"
          printf '%s\n' "${policy}"             | jq -e '[.bindings[]?.members[]?] | all(. != "allUsers" and . != "allAuthenticatedUsers")'

      - name: Execute acceptance cycle one
        run: |
          gcloud run jobs execute "${JOB_NAME}"             --project="${PROJECT_ID}"             --region="${REGION}"             --wait

      - name: Execute acceptance cycle two without edits
        run: |
          gcloud run jobs execute "${JOB_NAME}"             --project="${PROJECT_ID}"             --region="${REGION}"             --wait

      - name: Require two successful executions
        run: |
          executions="$(gcloud run jobs executions list             --job="${JOB_NAME}"             --project="${PROJECT_ID}"             --region="${REGION}"             --sort-by='~metadata.creationTimestamp'             --limit=2             --format=json)"
          printf '%s\n' "${executions}"             | jq -e 'length == 2 and all(.[]; (.status.conditions // []) | any(.type == "Completed" and .status == "True"))'

      - name: Confirm LIVE remains unavailable
        run: |
          test "$(grep -R 'deploy_live' -n infra/terraform 2>/dev/null | wc -l)" -eq 0
          echo PAPER_SHADOW_ACCEPTANCE_OK
