name: identity-2011-emissor-audit

on:
  pull_request:
    branches: [main]
    paths:
      - "src/mercado_financeiro/pit/b3_emissor.py"
      - "scripts/audit_identity_2011_with_emissor.py"
      - ".github/workflows/identity-2011-emissor-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install project
        run: pip install -e .
      - name: Audit 2011 identity coverage with B3 EMISSOR evidence
        run: python scripts/audit_identity_2011_with_emissor.py
